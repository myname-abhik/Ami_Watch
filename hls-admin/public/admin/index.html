<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLS Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2713%27%3E🎞%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f5;--text:#1b1f27;--muted:#6b7280;--border:#e3e6eb;
  --accent:#4f46e5;--accent-text:#fff;--danger:#dc2626;--ok:#16a34a;--shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--surface:#171a21;--surface2:#1f232c;--text:#e8eaee;--muted:#8b93a1;--border:#2a2f3a;
  --accent:#6366f1;--shadow:none}
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit;color:inherit}
.btn{border:1px solid var(--border);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password]{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hidden{display:none!important}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
#login form{width:100%;max-width:340px;padding:28px;display:grid;gap:12px}
#login h1{margin:0 0 4px;font-size:20px}
.err{color:var(--danger);min-height:18px;font-size:13px}

/* app */
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
header h1{font-size:16px;margin:0;flex:1}
main{max-width:1100px;margin:0 auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{padding:14px 16px}
.stat .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:22px;font-weight:600;margin-top:2px}
.bar{height:6px;background:var(--surface2);border-radius:99px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex:1;min-width:200px}
.crumbs a{cursor:pointer;color:var(--accent)}
.crumbs span{color:var(--muted)}
.search{max-width:200px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.name{width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis}
td.name a{cursor:pointer}
td.name a:hover{color:var(--accent)}
tr:hover td{background:var(--surface2)}
td.act{text-align:right}
td.act .btn{margin-left:4px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.tablewrap{overflow-x:auto}
.drop{outline:2px dashed var(--accent);outline-offset:-6px}
.ico{display:inline-block;width:18px;text-align:center;margin-right:6px}

/* conversion jobs */
#jobs .job{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
#jobs .job:last-child{border-bottom:0}
#jobs .jh{display:flex;justify-content:space-between;gap:8px}
#jobs .jh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#jobs .st{color:var(--muted);white-space:nowrap}
#jobs .st.failed{color:var(--danger)}#jobs .st.done{color:var(--ok)}
#jobs .msg{color:var(--danger);font-size:12px;margin-top:3px;word-break:break-word}
label.field{display:block;margin:10px 0 4px;color:var(--muted)}
.hint{color:var(--muted);font-size:12px;margin-top:6px}

/* upload queue */
#queue{position:fixed;right:16px;bottom:16px;width:320px;max-height:50vh;overflow:auto;padding:10px;z-index:20}
#queue .q{margin:6px 0;font-size:12px}
#queue .q .n{display:flex;justify-content:space-between;gap:8px}
#queue .q .n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
#queue .bar{margin-top:3px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:30}
.modal .card{width:100%;max-width:720px;padding:18px}
.modal h3{margin:0 0 12px;font-size:16px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
video{width:100%;background:#000;border-radius:8px;max-height:60vh}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:40;font-size:13px}
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="card" id="loginForm">
    <h1>HLS Admin</h1>
    <div style="color:var(--muted)">Sign in to manage your MEGA storage.</div>
    <input type="text" id="u" placeholder="Username" autocomplete="username" required>
    <input type="password" id="p" placeholder="Password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <h1>🎞 HLS Admin</h1>
    <a class="btn" href="/" target="_blank" rel="noopener" style="text-decoration:none">Open player ↗</a>
    <button class="btn" id="logout">Sign out</button>
  </header>
  <main>
    <div class="stats" id="stats"></div>

    <div class="card hidden" id="jobs" style="margin-bottom:18px"></div>

    <div class="card" id="panel">
      <div class="toolbar">
        <div class="crumbs" id="crumbs"></div>
        <input type="text" class="search" id="search" placeholder="Filter…">
        <button class="btn" id="newFolder">＋ New folder</button>
        <button class="btn primary" id="convertBtn" title="Upload a video; the server converts it to HLS and stores it in MEGA">🎬 Convert video</button>
        <button class="btn" id="uploadBtn">⬆ Upload files</button>
        <input type="file" id="fileInput" multiple class="hidden">
        <input type="file" id="videoInput" accept="video/*,.mkv,.avi,.mov,.flv,.wmv,.webm,.mp4,.m4v,.ts" class="hidden">
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr><th><input type="checkbox" id="all"></th><th>Name</th><th>Size</th><th>Modified</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="toolbar" id="bulk" style="border-top:1px solid var(--border);border-bottom:0">
        <span id="selInfo" style="color:var(--muted)">Drag &amp; drop files anywhere here to upload</span>
        <span style="flex:1"></span>
        <button class="btn danger" id="delSel" disabled>Delete selected</button>
      </div>
    </div>
  </main>
</section>

<div id="queue" class="card hidden"></div>
<div id="modal" class="modal hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(() => {
const $ = (id) => document.getElementById(id);
const API = "/admin/api";
let token = localStorage.getItem("adminToken");
let currentId = "root";
let items = [];
const selected = new Set();

/* ---------- util ---------- */
const fmtSize = (b) => {
  if (!b) return "—";
  const u = ["B","KB","MB","GB","TB"]; let i = 0;
  while (b >= 1024 && i < u.length-1) { b /= 1024; i++; }
  return b.toFixed(b >= 100 || i === 0 ? 0 : 1) + " " + u[i];
};
const fmtDate = (t) => t ? new Date(t).toLocaleString() : "—";
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e[k] = v;
  }
  for (const kid of kids) e.append(kid);
  return e;
}
function toast(msg) {
  const t = el("div", { class: "toast" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: "Bearer " + token,
      ...(opts.body ? { "Content-Type": "application/json" } : {}) },
  });
  if (res.status === 401) { signOut(); throw new Error("Session expired"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

/* ---------- auth ---------- */
function showLogin() { $("app").classList.add("hidden"); $("login").classList.remove("hidden"); }
function signOut() { token = null; localStorage.removeItem("adminToken"); showLogin(); }
$("logout").onclick = signOut;
$("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  $("loginErr").textContent = "";
  try {
    const res = await fetch(API + "/login", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("u").value, password: $("p").value }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Login failed");
    token = data.token; localStorage.setItem("adminToken", token);
    $("p").value = "";
    start();
  } catch (err) { $("loginErr").textContent = err.message; }
};

/* ---------- data ---------- */
async function loadStats() {
  try {
    const s = await api("/stats");
    const box = $("stats"); box.replaceChildren();
    const stat = (l, v, extra) => el("div", { class: "card stat" },
      el("div", { class: "l" }, l), el("div", { class: "v" }, v), ...(extra ? [extra] : []));
    box.append(stat("Video folders", String(s.topLevelFolders)));
    box.append(stat("Total files", String(s.files)));
    box.append(stat("Files size", fmtSize(s.bytes)));
    if (s.account) {
      const pct = Math.min(100, (s.account.used / s.account.total) * 100);
      const bar = el("div", { class: "bar" }, el("i"));
      bar.firstChild.style.width = pct + "%";
      box.append(stat("MEGA storage", `${fmtSize(s.account.used)} / ${fmtSize(s.account.total)}`, bar));
    }
  } catch (e) { /* non-fatal */ }
}

async function load(id = currentId) {
  const data = await api("/list?id=" + encodeURIComponent(id));
  currentId = data.id; items = data.items; selected.clear();
  $("search").value = "";
  renderCrumbs(data.path);
  render();
}

function renderCrumbs(path) {
  const c = $("crumbs"); c.replaceChildren();
  c.append(el("a", { onclick: () => load("root") }, "Root"));
  for (const p of path) {
    c.append(el("span", {}, "/"), el("a", { onclick: () => load(p.id) }, p.name));
  }
}

function render() {
  const q = $("search").value.trim().toLowerCase();
  const rows = $("rows"); rows.replaceChildren();
  const list = items.filter((i) => !q || i.name.toLowerCase().includes(q));
  if (!list.length) {
    rows.append(el("tr", {}, Object.assign(el("td", { class: "empty" }, "Nothing here yet"), { colSpan: 5 })));
  }
  for (const it of list) {
    const cb = el("input", { type: "checkbox", checked: selected.has(it.id),
      onchange: () => { cb.checked ? selected.add(it.id) : selected.delete(it.id); updateSel(); } });
    const nameCell = el("td", { class: "name" });
    nameCell.append(el("span", { class: "ico" }, it.directory ? "📁" : /\.m3u8$/i.test(it.name) ? "🎬" : /\.ts$/i.test(it.name) ? "🎞" : "📄"));
    nameCell.append(el("a", { onclick: () => it.directory ? load(it.id) : preview(it) }, it.name));
    const act = el("td", { class: "act" });
    if (it.hlsUrl) {
      if (/\.m3u8$/i.test(it.name)) act.append(el("button", { class: "btn sm", onclick: () => preview(it) }, "▶ Play"));
      act.append(el("button", { class: "btn sm", onclick: () => copy(location.origin + it.hlsUrl) }, "Copy URL"));
    }
    act.append(el("button", { class: "btn sm", onclick: () => rename(it) }, "Rename"));
    act.append(el("button", { class: "btn sm danger", onclick: () => remove([it]) }, "Delete"));
    rows.append(el("tr", {}, el("td", {}, cb), nameCell,
      el("td", {}, it.directory ? "—" : fmtSize(it.size)), el("td", {}, fmtDate(it.timestamp)), act));
  }
  updateSel();
}
function updateSel() {
  $("delSel").disabled = !selected.size;
  $("selInfo").textContent = selected.size ? `${selected.size} selected` : "Drag & drop files anywhere here to upload";
  $("all").checked = items.length > 0 && selected.size === items.length;
}
$("all").onchange = (e) => {
  selected.clear(); if (e.target.checked) items.forEach((i) => selected.add(i.id));
  render();
};
$("search").oninput = render;

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("URL copied"); }
  catch { prompt("Copy URL:", text); }
}

/* ---------- modal ---------- */
let hls = null;
function closeModal() {
  if (hls) { hls.destroy(); hls = null; }
  $("modal").classList.add("hidden"); $("modal").replaceChildren();
}
function openModal(card) {
  const m = $("modal"); m.replaceChildren(el("div", { class: "card" }, ...card));
  m.classList.remove("hidden");
  m.onclick = (e) => { if (e.target === m) closeModal(); };
}
function ask(title, label, value = "") {
  return new Promise((resolve) => {
    const input = el("input", { type: "text", value });
    const done = (v) => { closeModal(); resolve(v); };
    input.onkeydown = (e) => { if (e.key === "Enter") done(input.value); if (e.key === "Escape") done(null); };
    openModal([el("h3", {}, title), el("div", { style: "margin-bottom:6px;color:var(--muted)" }, label), input,
      el("div", { class: "row" },
        el("button", { class: "btn", onclick: () => done(null) }, "Cancel"),
        el("button", { class: "btn primary", onclick: () => done(input.value) }, "OK"))]);
    input.focus(); input.select();
  });
}
function confirmBox(title, msg, okLabel = "Delete", extra) {
  return new Promise((resolve) => {
    const done = (v) => { closeModal(); resolve(v); };
    openModal([el("h3", {}, title), el("div", {}, msg), ...(extra ? [extra] : []),
      el("div", { class: "row" },
        el("button", { class: "btn", onclick: () => done(false) }, "Cancel"),
        el("button", { class: "btn primary", onclick: () => done(true) }, okLabel))]);
  });
}
function preview(it) {
  if (!it.hlsUrl || !/\.m3u8$/i.test(it.name)) return toast("Preview is only available for .m3u8 playlists inside a top-level folder");
  const video = el("video", { controls: true, autoplay: true });
  openModal([el("h3", {}, it.name), video,
    el("div", { class: "row" }, el("button", { class: "btn", onclick: () => copy(location.origin + it.hlsUrl) }, "Copy URL"),
      el("button", { class: "btn primary", onclick: closeModal }, "Close"))]);
  if (window.Hls && Hls.isSupported()) { hls = new Hls(); hls.loadSource(it.hlsUrl); hls.attachMedia(video); }
  else video.src = it.hlsUrl; // Safari native HLS
}

/* ---------- actions ---------- */
$("newFolder").onclick = async () => {
  const name = await ask("New folder", "Folder name (for HLS, use your video's name)");
  if (!name) return;
  try { await api("/folder", { method: "POST", body: JSON.stringify({ parentId: currentId, name }) });
    await load(); loadStats(); } catch (e) { toast(e.message); }
};
async function rename(it) {
  const name = await ask("Rename", it.name, it.name);
  if (!name || name === it.name) return;
  try { await api("/rename", { method: "POST", body: JSON.stringify({ id: it.id, name }) }); await load(); }
  catch (e) { toast(e.message); }
}
async function remove(list) {
  const perm = el("label", { style: "display:block;margin-top:10px;color:var(--muted)" },
    el("input", { type: "checkbox" }), " Delete permanently (skip MEGA rubbish bin)");
  const msg = list.length === 1 ? `Delete “${list[0].name}”${list[0].directory ? " and everything in it" : ""}?`
    : `Delete ${list.length} items?`;
  const ok = await confirmBox("Confirm delete", msg, "Delete", perm);
  if (!ok) return;
  try {
    await api("/delete", { method: "POST", body: JSON.stringify({ ids: list.map((i) => i.id), permanent: perm.firstChild.checked }) });
    toast("Deleted"); await load(); loadStats();
  } catch (e) { toast(e.message); }
}
$("delSel").onclick = () => remove(items.filter((i) => selected.has(i.id)));

/* ---------- upload ---------- */
$("uploadBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = (e) => { uploadFiles([...e.target.files]); e.target.value = ""; };
const panel = $("panel");
["dragenter", "dragover"].forEach((ev) => panel.addEventListener(ev, (e) => { e.preventDefault(); panel.classList.add("drop"); }));
["dragleave", "drop"].forEach((ev) => panel.addEventListener(ev, (e) => { e.preventDefault(); panel.classList.remove("drop"); }));
panel.addEventListener("drop", (e) => uploadFiles([...e.dataTransfer.files]));

function uploadOne(file, parentId, bar, url) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", url || `${API}/upload?parentId=${encodeURIComponent(parentId)}&name=${encodeURIComponent(file.name)}`);
    xhr.setRequestHeader("Authorization", "Bearer " + token);
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) bar.style.width = (e.loaded / e.total * 100) + "%"; };
    xhr.onload = () => {
      if (xhr.status < 300) return resolve(xhr.responseText ? JSON.parse(xhr.responseText) : {});
      if (xhr.status === 401) signOut();
      let msg = xhr.statusText;
      try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
      reject(new Error(msg));
    };
    xhr.onerror = () => reject(new Error("Network error"));
    xhr.send(file);
  });
}
let uploading = false;
async function uploadFiles(files) {
  if (!files.length || uploading) return;
  uploading = true;
  const target = currentId;
  const q = $("queue"); q.classList.remove("hidden"); q.replaceChildren();
  const entries = files.map((f) => {
    const bar = el("i"); const status = el("span", {}, "waiting");
    q.append(el("div", { class: "q" }, el("div", { class: "n" }, el("b", {}, f.name), status), el("div", { class: "bar" }, bar)));
    return { f, bar, status };
  });
  let failed = 0;
  for (const { f, bar, status } of entries) {
    status.textContent = "uploading";
    try { await uploadOne(f, target, bar); bar.style.width = "100%"; status.textContent = "done"; }
    catch (e) { failed++; status.textContent = "failed: " + e.message; status.style.color = "var(--danger)"; }
  }
  uploading = false;
  toast(failed ? `${failed} upload(s) failed` : "Upload complete");
  if (currentId === target) await load();
  loadStats();
  setTimeout(() => { if (!uploading) q.classList.add("hidden"); }, failed ? 8000 : 3000);
}


/* ---------- convert video (ffmpeg -> HLS -> MEGA) ---------- */
let ffmpegOk = true;
$("convertBtn").onclick = () => $("videoInput").click();
$("videoInput").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f || uploading) return;
  const name = await ask("Convert video to HLS",
    "Name for the video. It becomes the MEGA folder and the URL: /hls/<name>/index.m3u8",
    f.name.replace(/\.[^.]+$/, ""));
  if (!name) return;
  uploading = true;
  const q = $("queue"); q.classList.remove("hidden"); q.replaceChildren();
  const bar = el("i"); const status = el("span", {}, "uploading");
  q.append(el("div", { class: "q" }, el("div", { class: "n" }, el("b", {}, f.name), status), el("div", { class: "bar" }, bar)));
  try {
    await uploadOne(f, null, bar, `${API}/transcode?name=${encodeURIComponent(name.trim())}&filename=${encodeURIComponent(f.name)}`);
    bar.style.width = "100%"; status.textContent = "queued";
    toast("Uploaded. Converting on the server…");
    pollJobs();
  } catch (err) { status.textContent = "failed: " + err.message; status.style.color = "var(--danger)"; toast(err.message); }
  uploading = false;
  setTimeout(() => { if (!uploading) q.classList.add("hidden"); }, 3000);
};

const activeStates = new Set(["queued", "converting", "uploading"]);
const seenDone = new Set();
let polling = false;
async function pollJobs() {
  if (polling) return; polling = true;
  try {
    for (;;) {
      const data = await api("/jobs");
      ffmpegOk = data.ffmpeg; $("convertBtn").disabled = !ffmpegOk;
      $("convertBtn").title = ffmpegOk ? "Upload a video; the server converts it to HLS and stores it in MEGA" : "ffmpeg is not installed on the server";
      renderJobs(data.jobs);
      let refresh = false;
      for (const j of data.jobs) if (j.status === "done" && !seenDone.has(j.id)) { seenDone.add(j.id); refresh = true; }
      if (refresh) { toast("Conversion finished"); load().catch(() => {}); loadStats(); }
      if (!data.jobs.some((j) => activeStates.has(j.status))) break;
      await new Promise((r) => setTimeout(r, 2000));
    }
  } catch (e) { /* signed out or offline: stop quietly */ }
  polling = false;
}
function renderJobs(jobs) {
  const box = $("jobs"); box.replaceChildren();
  if (!jobs.length) return box.classList.add("hidden");
  box.classList.remove("hidden");
  box.append(el("div", { class: "toolbar" }, el("b", {}, "Conversions")));
  for (const j of jobs.slice(0, 8)) {
    const bar = el("div", { class: "bar" }, el("i")); bar.firstChild.style.width = (j.progress || 0) + "%";
    const label = activeStates.has(j.status) ? `${j.stage} ${j.progress || 0}%` : j.stage;
    const row = el("div", { class: "job" },
      el("div", { class: "jh" }, el("b", {}, j.name), el("span", { class: "st " + j.status }, label)));
    if (activeStates.has(j.status)) row.append(bar);
    if (j.error) row.append(el("div", { class: "msg" }, j.error));
    if (j.url) row.append(el("div", { class: "hint" }, "URL: " + location.origin + j.url));
    box.append(row);
  }
}

/* ---------- boot ---------- */
async function start() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  pollJobs();
  try { await load("root"); loadStats(); }
  catch (e) {
    if (!token) return;
    toast(e.message);
    $("rows").replaceChildren(el("tr", {}, Object.assign(el("td", { class: "empty" }, e.message), { colSpan: 5 })));
  }
}
(async () => {
  if (!token) return showLogin();
  start();
})();
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("modal").classList.contains("hidden")) closeModal(); });
})();
</script>
</body>
